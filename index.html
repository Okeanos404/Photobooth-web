<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photobooth Studio</title>

  <link rel="stylesheet" href="assets/style.css" />
  <link rel="icon" href="favicon.ico">
</head>
<body>

  <!-- BACKGROUND -->
  <div class="bg"></div>

  <div class="app">

    <!-- ================= HEADER ================= -->
    <header class="header">
      <div class="brand">
        <div class="mark">
          <img src="assets/logo.png" alt="Photobooth Studio" class="logo-img">
        </div>
        <div>
          <h1>Photobooth Studio</h1>
          <p>Live camera • Auto capture • Download</p>
        </div>
      </div>

      <div class="right">
        <span class="tiny">Simple UX • Aesthetic UI</span>
      </div>
    </header>

    <!-- ================= MAIN ================= -->
    <main>

      <section class="card">

        <!-- ===== CAMERA HEADER ===== -->
        <div class="card-head">
          <div>
            <h2>Live Camera</h2>
            <span class="desc">Square 1:1</span>
          </div>

          <div class="head-actions">
            <button id="btnStart" class="btn primary">Start</button>
            <button id="btnMirror" class="btn ghost" disabled>Mirror: OFF</button>
          </div>
        </div>

        <!-- ===== CAMERA AREA (ONLY CAMERA) ===== -->
        <div class="camera-wrap">
          <div class="quad">
            <video id="video" autoplay playsinline class="hidden-video"></video>
            <canvas id="cameraCanvas"></canvas>

            <!-- HUD -->
            <div class="quad-hud">
              <span id="hudFrame" class="pill">Frame: Korean</span>
              <span id="hudFx" class="pill">Effect: None</span>
              <span id="hudShots" class="pill">Shots: 0/6</span>
            </div>

            <!-- COUNTDOWN -->
            <div id="countdown" class="countdown hidden">
              <div class="count-circle"></div>
              <div id="countText" class="count-text">3</div>
            </div>

            <!-- FLASH -->
            <div id="flash" class="flash hidden"></div>
          </div>
        </div>

        <!-- ===== SHUTTER BUTTON (SEPARATE) ===== -->
        <div class="shutter-wrap">
          <button id="btnShutter" class="shutter-btn" disabled>
            <span class="shutter-ring"></span>
          </button>
        </div>

        <!-- ===== CONTROL PANEL ===== -->
        <div class="panel compact-panel">
          <div class="panel-grid">

            <!-- FRAME -->
            <div class="panel-block">
              <label>Frame Template</label>
              <div class="segmented">
                <button class="seg active" data-frame="korean">Korean</button>
                <button class="seg" data-frame="kawaii">Kawaii</button>
                <button class="seg" data-frame="neon">Neon</button>
              </div>
            </div>

            <!-- EFFECT -->
            <div class="panel-block">
              <label>Effect</label>
              <select id="effect" class="select">
                <option value="none">None</option>
                <option value="bw">B&W</option>
                <option value="vintage">Vintage</option>
                <option value="soft">Soft Glow</option>
                <option value="grain">Film Grain</option>
                <option value="cool">Cool</option>
              </select>
            </div>

            <!-- TIMER -->
            <div class="panel-block">
              <label>Timer (per photo)</label>
              <select id="timer" class="select">
                <option value="0">No Timer</option>
                <option value="2" selected>2s</option>
                <option value="3">3s</option>
                <option value="5">5s</option>
              </select>
            </div>
          </div>

          <!-- ACTION BUTTONS -->
          <div class="panel-actions">
            <button id="btnAuto" class="btn primary" disabled>Auto Capture</button>
            <button id="btnRetake" class="btn ghost" disabled>Retake Last</button>
            <button id="btnReset" class="btn danger">Reset</button>
          </div>

          <!-- PROGRESS -->
          <div id="progress" class="progress hidden">
            <div id="bar" class="bar"></div>
            <span id="progressText">Taking photos...</span>
          </div>
        </div>

        <!-- ===== PREVIEW ===== -->
        <div class="panel">
          <label>Preview Foto</label>

          <!-- GRID FOTO -->
          <div id="previewGrid" class="preview-grid"></div>

          <!-- DOWNLOAD BUTTON (DI LUAR GRID) -->
          <div class="preview-actions">
            <button id="btnDownload" class="btn primary" disabled>
            Download Photostrip
            </button>
          </div>
        </div>

        <!-- OUTPUT -->
        <canvas id="stripCanvas" class="hidden"></canvas>

      </section>
    </main>

    <!-- ================= FOOTER ================= -->
    <footer class="footer">
      <small>Made by Riyan ✨</small>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
